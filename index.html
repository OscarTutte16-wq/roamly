<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="description" content="Roamly – plan trips with pin-point maps that work offline.">
<title>Roamly – Travel planner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Roamly">
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="vendor/maplibre/maplibre-gl.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="panel" class="panel">
    <div id="sheetHandle" class="sheet-handle" aria-label="Drag to resize"><span></span></div>
    <header class="brand">
      <div class="logo"><img src="icons/icon.svg" alt=""><span>Roamly</span></div>
      <div id="netStatus" class="net-pill" title="Connection status">Online</div>
    </header>
    <div id="netBanner" class="banner hidden" role="status"></div>

    <nav class="tabs" role="tablist">
      <button class="tab active" data-tab="explore" role="tab">Explore</button>
      <button class="tab" data-tab="trips" role="tab">Trips</button>
      <span class="ind"></span>
    </nav>

    <section id="tab-explore" class="tab-body">
      <form id="searchForm" class="search" autocomplete="off">
        <input id="searchInput" type="search" placeholder="Search places" aria-label="Search places">
        <button type="submit" class="icon-btn accent search-go" aria-label="Search">→</button>
      </form>
      <ul id="suggestions" class="suggestions hidden"></ul>
      <p id="searchHint" class="hint">Towns, villages and addresses worldwide.</p>
      <div id="results" class="results"></div>
    </section>

    <section id="tab-trips" class="tab-body hidden">
      <div id="tripList"></div>
      <div id="tripDetail" class="hidden"></div>
    </section>
  </aside>
  <main id="mapWrap">
    <div id="map"></div>
    <button id="locateBtn" class="fab" title="Locate me" aria-label="Locate me">◎</button>
    <button id="panelToggle" class="fab fab-panel" aria-label="Toggle panel">☰</button>
  </main>
</div>

<div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div class="modal-card" id="modalCard"></div></div>
<div id="toast" class="toast hidden"></div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="vendor/maplibre/maplibre-gl.js"></script>
<script src="vendor/maplibre/leaflet-maplibre-gl.js"></script>
<script src="app.js"></script>
<script src="features/auth.js"></script>
<script src="features/share.js"></script>
</body>
</html>
